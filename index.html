<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatchEval - AI Conversation Judge</title>
    <script>
      tailwind.config = {
        darkMode: 'media',
        theme: {
          extend: {
            colors: {
              primary: { DEFAULT: '#1E40AF', foreground: '#FFFFFF' },
              secondary: { DEFAULT: '#3B82F6', foreground: '#FFFFFF' },
              accent: { DEFAULT: '#D97706', foreground: '#FFFFFF' },
              background: '#F8FAFC',
              foreground: '#1E3A8A',
              muted: { DEFAULT: '#E9EEF6', foreground: '#64748B' },
              border: '#DBEAFE',
              destructive: { DEFAULT: '#DC2626', foreground: '#FFFFFF' },
              ring: '#1E40AF'
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['"Fira Code"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
            },
            keyframes: {
              'fade-in': { from: { opacity: 0 }, to: { opacity: 1 } }
            }
          }
        }
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        height: 100%;
        background-color: #f8fafc;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #0b1220;
        }
      }
      /* Custom scrollbar for chat area */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Tabular numerals for scores, counts, timestamps */
      .font-mono, .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      /* Consistent, visible keyboard focus ring across native + custom controls */
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid #1E40AF;
        outline-offset: 2px;
        border-radius: 4px;
      }
      @media (prefers-color-scheme: dark) {
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        [tabindex]:focus-visible {
          outline-color: #93C5FD;
        }
      }
      /* Respect reduced-motion preference: neutralize decorative animation */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
